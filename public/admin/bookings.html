<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ── Meta ── -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="RETRET Hotel Admin – Manage Bookings" />
  <title>Manage Bookings – RETRET Hotel Admin</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- ── Favicon ── -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />

  <!-- ── Google Fonts ── -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />

  <!-- ── Shared CSS ── -->
  <link rel="stylesheet" href="../css/style.css" />

  <!-- ── Admin styles ── -->
  <style>
    .admin-wrapper    { display: flex; min-height: 100vh; }
    .admin-sidebar    { width: 240px; background: var(--navy); padding: 2rem 1.5rem; flex-shrink: 0; }
    .admin-main       { flex: 1; padding: 2.5rem; background: var(--gray); overflow-y: auto; }
    .sidebar-brand    { color: var(--gold); font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; display: block; margin-bottom: 2.5rem; }
    .sidebar-brand span { color: var(--white); }
    .sidebar-nav      { list-style: none; }
    .sidebar-nav li   { margin-bottom: 0.5rem; }
    .sidebar-nav a    { display: flex; align-items: center; gap: 0.6rem; color: rgba(255,255,255,0.75); padding: 0.7rem 1rem; border-radius: var(--radius); transition: var(--transition); font-size: 0.95rem; }
    .sidebar-nav a:hover,
    .sidebar-nav a.active { background: rgba(201,168,76,0.15); color: var(--gold); }
    .sidebar-divider  { height: 1px; background: rgba(255,255,255,0.1); margin: 1.5rem 0; }
    .sidebar-signout  { background: none; border: 1px solid rgba(255,255,255,0.2); color: rgba(255,255,255,0.75); padding: 0.6rem 1rem; border-radius: var(--radius); cursor: pointer; width: 100%; text-align: left; font-size: 0.9rem; transition: var(--transition); }
    .sidebar-signout:hover { background: rgba(255,255,255,0.08); color: var(--white); }
    .admin-header     { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    .admin-header h1  { font-size: 1.8rem; color: var(--navy); }
    .admin-card       { background: var(--white); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow); }
    .admin-table      { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .admin-table th   { text-align: left; padding: 0.7rem 1rem; background: var(--gray); color: var(--navy); font-weight: 700; border-bottom: 2px solid var(--gray-dark); }
    .admin-table td   { padding: 0.75rem 1rem; border-bottom: 1px solid var(--gray-dark); vertical-align: middle; }
    .admin-table tr:last-child td { border-bottom: none; }
    .status-badge     { display: inline-block; padding: 0.2rem 0.65rem; border-radius: 999px; font-size: 0.78rem; font-weight: 700; text-transform: capitalize; }
    .status-pending   { background: #fff3cd; color: #856404; }
    .status-confirmed { background: #d1e7dd; color: #0f5132; }
    .status-cancelled { background: #f8d7da; color: #842029; }
    .table-actions    { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btn-sm           { padding: 0.3rem 0.75rem; border-radius: var(--radius); border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: var(--transition); }
    .btn-view         { background: var(--navy); color: white; }
    .btn-view:hover   { background: var(--navy-light); }
    .btn-delete       { background: #dc3545; color: white; }
    .btn-delete:hover { background: #c82333; }
    .btn-danger       { background: #dc3545; color: white; border: none; padding: 0.6rem 1.2rem; border-radius: var(--radius); cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .btn-danger:hover { background: #c82333; }
    .admin-alert      { display: none; padding: 0.9rem 1.2rem; border-radius: var(--radius); margin-bottom: 1.5rem; font-size: 0.95rem; font-weight: 500; }
    .admin-alert.visible { display: block; }
    .admin-alert-success { background: #d1e7dd; color: #0f5132; }
    .admin-alert-error   { background: #f8d7da; color: #842029; }

    /* ── Filter bar ── */
    .filter-bar       { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filter-bar label { font-weight: 600; font-size: 0.9rem; color: var(--navy); }
    .filter-bar select { padding: 0.5rem 0.8rem; border: 1px solid var(--gray-dark); border-radius: var(--radius); font-size: 0.9rem; color: var(--text); }

    /* ── Modal ── */
    .modal-backdrop   { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 2rem 1rem; }
    .modal-backdrop.visible { display: flex; }
    .modal-box        { background: var(--white); border-radius: var(--radius); padding: 2rem; max-width: 560px; width: 100%; margin: auto; box-shadow: var(--shadow-lg); }
    .modal-header     { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .modal-header h3  { color: var(--navy); }
    .modal-close      { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-light); line-height: 1; padding: 0.2rem 0.5rem; }
    .modal-close:hover { color: var(--navy); }
    .modal-footer     { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1.5rem; flex-wrap: wrap; }
    .modal-cancel     { background: var(--gray); color: var(--text); border: none; padding: 0.6rem 1.2rem; border-radius: var(--radius); cursor: pointer; font-weight: 600; }
    .modal-cancel:hover { background: var(--gray-dark); }

    /* ── Booking detail list ── */
    .detail-list      { display: grid; grid-template-columns: 140px 1fr; gap: 0.6rem 1rem; font-size: 0.9rem; }
    .detail-list dt   { font-weight: 700; color: var(--navy); }
    .detail-list dd   { color: var(--text); margin: 0; word-break: break-all; }

    #authLoadingOverlay { display: flex; position: fixed; inset: 0; background: var(--navy); z-index: 9999; align-items: center; justify-content: center; color: var(--gold); font-size: 1.2rem; font-family: 'Playfair Display', serif; }

    @media (max-width: 768px) {
      .admin-wrapper  { flex-direction: column; }
      .admin-sidebar  { width: 100%; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
      .sidebar-brand  { margin-bottom: 0; }
      .sidebar-nav    { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      .sidebar-nav li { margin-bottom: 0; }
      .admin-main     { padding: 1.5rem; }
      .admin-table th { display: none; }
      .admin-table td { display: flex; justify-content: space-between; padding: 0.5rem 0.8rem; }
      .admin-table td::before { content: attr(data-label); font-weight: 700; color: var(--navy); }
      .detail-list    { grid-template-columns: 1fr; }
    }
  </style>

  <!-- ── Firebase CDN ── -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Auth loading overlay -->
  <div id="authLoadingOverlay" role="status" aria-live="polite">✦ Verifying access…</div>

  <div class="admin-wrapper" id="adminContent" style="display:none;">

    <!-- ── Sidebar ── -->
    <aside class="admin-sidebar" role="navigation" aria-label="Admin navigation">
      <a href="dashboard.html" class="sidebar-brand">RET<span>RET</span> Admin</a>
      <ul class="sidebar-nav">
        <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
        <li><a href="rooms.html"><span class="icon">🛏️</span> Rooms</a></li>
        <li><a href="bookings.html" class="active" aria-current="page"><span class="icon">📅</span> Bookings</a></li>
      </ul>
      <div class="sidebar-divider"></div>
      <a href="../index.html" style="color:rgba(255,255,255,0.6); font-size:0.85rem; display:block; margin-bottom:0.75rem;">← Back to website</a>
      <button class="sidebar-signout" id="signOutBtn" type="button">Sign Out</button>
    </aside>

    <!-- ── Main ── -->
    <main class="admin-main" role="main">

      <div class="admin-header">
        <h1>Manage Bookings</h1>
      </div>

      <!-- Status alert -->
      <div id="adminAlert" class="admin-alert" role="alert" aria-live="assertive"></div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <label for="bookingStatusFilter">Filter by status:</label>
        <select id="bookingStatusFilter" aria-label="Filter bookings by status">
          <option value="">All bookings</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="cancelled">Cancelled</option>
        </select>
      </div>

      <!-- Bookings table -->
      <div class="admin-card">
        <div style="overflow-x:auto;">
          <table class="admin-table" aria-label="Bookings management">
            <thead>
              <tr>
                <th>Guest</th>
                <th>Email</th>
                <th>Room</th>
                <th>Check-in</th>
                <th>Check-out</th>
                <th>Guests</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="bookingsTableBody">
              <tr><td colspan="8" style="text-align:center;padding:2rem;">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- ══════════════════════════════════════════════════════════════
       BOOKING DETAIL MODAL
       ══════════════════════════════════════════════════════════════ -->
  <div class="modal-backdrop" id="bookingModal" role="dialog" aria-modal="true" aria-labelledby="bookingModalTitle">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="bookingModalTitle">Booking Details</h3>
        <button class="modal-close" type="button" aria-label="Close modal">&times;</button>
      </div>
      <!-- Populated dynamically by viewBooking() in admin.js -->
      <div id="bookingModalContent">
        <p style="text-align:center;padding:2rem;">Loading…</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="modal-cancel">Close</button>
      </div>
    </div>
  </div>

  <!-- ── Scripts ── -->
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="admin.js"></script>

  <script>
    /* ── Bootstrap ── */
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('signOutBtn').addEventListener('click', () => {
        signOut('../index.html');
      });

      requireAdminAuth((user) => {
        document.getElementById('adminContent').style.display = 'flex';
        initAdminBookings(user);
      }, 'login.html');
    });
  </script>

</body>
</html>
